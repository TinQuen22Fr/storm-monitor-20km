name: Build Android APK

on:
  push:
    branches: [Version_With_Detector, main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances frontend
        run: yarn install

      - name: Build du frontend React (pointé vers le serveur Kimsufi)
        env:
          REACT_APP_BACKEND_URL: https://storm-monitor.quentin-astro.fr
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: yarn build

      - name: Synchronisation Capacitor -> Android
        run: npx cap sync android

      - name: Installation de Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Versionnage automatique de l'APK
        working-directory: frontend/android
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Compilation APK Debug
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar absent, régénération..."
            gradle wrapper --gradle-version 8.11.1
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Renommage APK Debug
        working-directory: frontend/android
        run: cp app/build/outputs/apk/debug/app-debug.apk storm-monitor-debug.apk

      - name: Upload APK Debug (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storm-monitor-debug
          path: frontend/android/storm-monitor-debug.apk
          retention-days: 30

      # ----- APK Release signé (uniquement si le secret KEYSTORE_BASE64 existe) -----
      - name: Décodage du keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        working-directory: frontend/android
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Compilation APK Release signé
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommage APK Release
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        run: cp app/build/outputs/apk/release/app-release.apk storm-monitor-release.apk

      - name: Upload APK Release (artifact)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: storm-monitor-release
          path: frontend/android/storm-monitor-release.apk
          retention-days: 90

      - name: Nettoyage du keystore
        if: ${{ always() && env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        run: rm -f release.keystore

      - name: Publication de l'APK en Release GitHub (téléchargeable sur mobile)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: "📱 Storm Monitor v1.0.${{ github.run_number }}"
          body: |
            APK Android compilé automatiquement le ${{ github.event.head_commit.timestamp }}
            (commit `${{ github.sha }}`).

            **Installation :** télécharger `storm-monitor-debug.apk` ci-dessous,
            l'ouvrir sur le téléphone et installer par-dessus l'ancienne version.
          make_latest: "true"
          prerelease: false
          files: |
            frontend/android/storm-monitor-debug.apk
            frontend/android/storm-monitor-release.apk
          fail_on_unmatched_files: false

    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

